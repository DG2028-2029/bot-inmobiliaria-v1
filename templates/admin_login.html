<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — IPOX</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%230B1F3A%22/%3E%3Cpath d=%22M7 17 16 8l9 9%22 fill=%22none%22 stroke=%22%23C9A24B%22 stroke-width=%222.6%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3Crect x=%2214.4%22 y=%2215%22 width=%223.2%22 height=%229%22 rx=%221.2%22 fill=%22%23fff%22/%3E%3C/svg%3E">
    <style>
        :root {
            --ix-navy:#0B1F3A; --ix-navy-2:#132C50; --ix-navy-3:#1D3A66;
            --ix-gold:#C9A24B; --ix-gold-2:#E6D3A0; --ix-gold-3:#F7F0DC;
            --ix-ivory:#F6F4EF; --ix-card:#FFFFFF; --ix-ink:#18233A; --ix-muted:#6B7385; --ix-line:#E8E3D6;
            --ix-bad:#A33B35; --ix-bad-bg:#F8E6E4;
            --ix-serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
            --ix-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
            --ix-radius:16px;
            --accent:#C9A24B;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: var(--ix-sans);
            background: linear-gradient(160deg, var(--ix-navy) 0%, var(--ix-navy-2) 100%);
            color: var(--ix-ink);
            line-height: 1.45;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px 16px;
            -webkit-font-smoothing: antialiased;
        }
        .ix-brand { display: flex; align-items: center; justify-content: center; gap: 12px; color: #fff; margin-bottom: 24px; }
        .ix-mark { width: 40px; height: 40px; flex: none; }
        .ix-word { font-family: var(--ix-serif); font-size: 24px; letter-spacing: .3em; font-weight: 600; line-height: 1; display: block; }
        .ix-sub { display: block; font-size: 9.5px; letter-spacing: .24em; text-transform: uppercase; color: var(--ix-gold-2); margin-top: 6px; font-weight: 500; }
        .card {
            background: var(--ix-card);
            border-top: 4px solid var(--accent);
            border-radius: 18px;
            padding: 38px 34px 34px;
            max-width: 390px; width: 100%;
            box-shadow: 0 30px 70px rgba(0,0,0,.4);
        }
        .icon {
            width: 60px; height: 60px;
            background: var(--ix-navy);
            border-radius: 14px; display: flex; align-items: center;
            justify-content: center; font-size: 26px; margin: 0 auto 18px;
        }
        h2 { text-align: center; font-family: var(--ix-serif); color: var(--ix-navy); font-size: 25px; font-weight: 600; margin-bottom: 6px; line-height: 1.25; }
        p { text-align: center; color: var(--ix-muted); font-size: 13.5px; margin-bottom: 26px; }
        label { display: block; font-size: 11px; font-weight: 700; color: var(--ix-muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 7px; }
        input {
            width: 100%; padding: 13px 15px; border: 1px solid var(--ix-line);
            border-radius: 10px; font-size: 15px; background: var(--ix-ivory); color: var(--ix-ink);
            font-family: inherit; transition: .2s;
        }
        input::placeholder { color: #A5ABB8; }
        input:focus { outline: none; border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(201,162,75,.2); }
        button {
            width: 100%; padding: 14px; margin-top: 16px;
            background: var(--ix-navy);
            color: white; border: none; border-radius: 999px;
            font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; transition: .2s;
        }
        button:hover { background: var(--accent); color: var(--ix-navy); }
        button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        .error {
            background: var(--ix-bad-bg); border: 1px solid #EBC5C1; color: var(--ix-bad);
            padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 600;
            text-align: center; margin-bottom: 16px;
        }
        @media (max-width: 480px) {
            .card { padding: 30px 22px 28px; }
        }
    </style>
</head>
<body>
    <div class="ix-brand">
        <svg class="ix-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#13294B"/><rect x=".75" y=".75" width="30.5" height="30.5" rx="7.25" fill="none" stroke="#C9A24B" stroke-opacity=".55" stroke-width="1.5"/><path d="M7 17 16 8l9 9" fill="none" stroke="#C9A24B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="14.4" y="15" width="3.2" height="9" rx="1.2" fill="#fff"/></svg>
        <span><span class="ix-word">IPOX</span><span class="ix-sub">CRM Inmobiliario</span></span>
    </div>
    <div class="card">
        <div class="icon">🔐</div>
        <h2>Panel de Admin</h2>
        <p>Acceso exclusivo para administradores</p>
        {% if error %}<div class="error">⚠️ {{ error }}</div>{% endif %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>Contraseña de administrador</label>
            <input type="password" name="password" placeholder="••••••••••••" required autofocus>
            <button type="submit">Entrar al Panel</button>
        </form>
    </div>
</body>
</html>
