<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar contraseña — {{ cliente.nombre }}</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
        font-family:'Segoe UI',Arial,sans-serif;
        background:linear-gradient(135deg, {{ cliente.color_primario or '#667eea' }}, #1a1a2e);
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:20px;
    }
    .card {
        background:white;
        border-radius:16px;
        max-width:420px;
        width:100%;
        padding:36px 30px;
        box-shadow:0 20px 60px rgba(0,0,0,0.3);
    }
    .icono { text-align:center; font-size:40px; margin-bottom:10px; }
    h1 {
        text-align:center;
        font-size:20px;
        color:#2c3e50;
        margin-bottom:6px;
    }
    .subtitulo {
        text-align:center;
        color:#888;
        font-size:13px;
        margin-bottom:26px;
    }
    label {
        display:block;
        font-size:13px;
        color:#555;
        margin-bottom:6px;
        font-weight:600;
    }
    input[type="email"] {
        width:100%;
        padding:12px 14px;
        border:1px solid #ddd;
        border-radius:8px;
        font-size:15px;
        margin-bottom:18px;
    }
    input[type="email"]:focus {
        outline:none;
        border-color:{{ cliente.color_primario or '#667eea' }};
    }
    button {
        width:100%;
        padding:13px;
        background:{{ cliente.color_primario or '#667eea' }};
        color:white;
        border:none;
        border-radius:8px;
        font-size:15px;
        font-weight:bold;
        cursor:pointer;
    }
    button:hover { opacity:0.92; }
    .mensaje {
        background:#f0fff4;
        border-left:4px solid #27ae60;
        padding:14px 16px;
        border-radius:6px;
        color:#2c3e50;
        font-size:14px;
        margin-bottom:20px;
    }
    .volver {
        display:block;
        text-align:center;
        margin-top:18px;
        color:{{ cliente.color_primario or '#667eea' }};
        text-decoration:none;
        font-size:13px;
        font-weight:600;
    }
</style>
</head>
<body>
<div class="card">
    <div class="icono">🔐</div>
    <h1>Recuperar contraseña</h1>
    <p class="subtitulo">{{ cliente.nombre }}</p>

    {% if mensaje %}
        <div class="mensaje">{{ mensaje }}</div>
    {% else %}
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" required placeholder="tu@email.com">
            <button type="submit">Enviar enlace de recuperación</button>
        </form>
    {% endif %}

    <a class="volver" href="{{ url_for('login', cliente_id=cliente_id) }}">← Volver al inicio de sesión</a>
</div>
</body>
</html>
